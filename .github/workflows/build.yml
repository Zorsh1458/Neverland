name: plugin-build
run-name: Building plugin
on: [push, workflow_dispatch]
jobs:
  build-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: server-game
          path: build/libs/server-game.jar
  deploy-game:
    needs: [build-game]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: server-game
          path: downloaded_artifact_plugin/
      
      - name: Deploy to test server
        uses: sand4rt/ftp-deployer@v1.10
        with:
          sftp: true
          host: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          remote_folder: plugins
          local_folder: downloaded_artifact_plugin
          cleanup: false
          include: '["server-game.jar"]'
          exclude: '[]'
          passive: true
  notify-game:
    needs: [deploy-game]
    runs-on: ubuntu-latest
    steps:
      - name: Discord notification raw
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        uses: Ilshidur/action-discord@ad5235de713df3ef38022185499b02ffe93b7efe
        with:
          args: ':beginner: Project (GAME) loaded: ${{ github.event.head_commit.message }}'
  pre-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Set current timestamp
        run: echo "TIMESTAMP=$(date +'%Y.%m.%d %H:%M')" >> $GITHUB_ENV

      - name: Discord notification raw
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        uses: Ilshidur/action-discord@ad5235de713df3ef38022185499b02ffe93b7efe
        with:
          args: 'Loading project...'

      - name: Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_EMBEDS: '[{"description": ":recycle: **Проект загружается**\n- `${{ github.event.head_commit.author.username }}` - [${{ github.event.head_commit.message }}](${{ github.event.head_commit.url }})"}]'
        uses: Ilshidur/action-discord@ad5235de713df3ef38022185499b02ffe93b7efe
        with:
          args: ''
  build-resourcepack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew makeResourcePack

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Neverland
          path: build/resourcepack/Neverland.zip
  deploy-resourcepack:
    needs: [build-resourcepack]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: Neverland
          path: downloaded_artifact_rp/

      - name: Deploy to test server
        uses: sand4rt/ftp-deployer@v1.10
        with:
          sftp: true
          host: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          remote_folder: resourcepack
          local_folder: downloaded_artifact_rp
          cleanup: false
          include: '["Neverland.zip"]'
          exclude: '[]'
          passive: true
  notify-resourcepack:
    needs: [deploy-resourcepack]
    runs-on: ubuntu-latest
    steps:
      - name: Discord notification raw
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        uses: Ilshidur/action-discord@ad5235de713df3ef38022185499b02ffe93b7efe
        with:
          args: 'Resource pack loaded'

      - name: Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_EMBEDS: '[{"color": 11892823,"footer": {"text": "Перезайдите для перезагрузки ресурспака"},"description": ":dividers: **Ресурспак обновлен**"}]'
        uses: Ilshidur/action-discord@ad5235de713df3ef38022185499b02ffe93b7efe
        with:
          args: ''
